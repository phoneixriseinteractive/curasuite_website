<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — CuraSuite Admin</title>
  <meta name="robots" content="noindex, nofollow">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/admin.css' %}">
  <style>
    .login-page { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
    @media(max-width:768px){.login-page{grid-template-columns:1fr}.login-brand{display:none}}
    .login-brand {
      background:var(--adm-accent); display:flex; flex-direction:column;
      justify-content:center; align-items:flex-start; padding:60px; color:white;
    }
    .login-form-area {
      display:flex; align-items:center; justify-content:center;
      padding:40px; background:var(--adm-bg);
    }
    .login-card {
      width:100%; max-width:400px; background:var(--adm-surface);
      border:1px solid var(--adm-border); border-radius:var(--adm-radius-lg);
      padding:40px; box-shadow:var(--adm-shadow-md);
    }
  </style>
</head>
<body class="admin-body">
<div class="login-page">
  <div class="login-brand">
    <div style="display:inline-block;background:#F7F7F7;border-radius:12px;padding:10px 16px;margin-bottom:40px;">
      <img src="{% static 'img/curasuite-logo-footer.webp' %}" alt="CuraSuite" width="420" height="93" style="height:28px;width:auto;display:block;">
    </div>
    <h1 style="font-size:36px;font-weight:800;margin-bottom:16px;line-height:1.2;color:white;">Forgot your password?</h1>
    <p style="font-size:16px;opacity:.75;max-width:340px;line-height:1.6;">No problem — we'll email you a link to set a new one.</p>
  </div>
  <div class="login-form-area">
    <div class="login-card">
      <div style="margin-bottom:32px;">
        <h2 style="font-size:22px;font-weight:700;color:var(--adm-text-primary);margin-bottom:6px;">Reset your password</h2>
        <p style="font-size:13px;color:var(--adm-text-muted);">Enter your admin email address and we'll send you a reset link.</p>
      </div>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="adm-form-group">
          <label class="adm-label" for="id_email">Email address</label>
          <input type="email" name="email" id="id_email" class="adm-input" placeholder="admin@curasuite.com" autocomplete="email" autofocus required value="{{ form.email.value|default:'' }}">
        </div>
        <button type="submit" class="adm-btn adm-btn-primary" style="width:100%;justify-content:center;padding:10px 16px;font-size:14px;margin-bottom:12px;">Send reset link</button>
      </form>
      <p style="text-align:center;font-size:13px;">
        <a href="{% url 'admin_panel:login' %}" style="color:var(--adm-text-muted);">Back to login</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
